
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101411">
  <title>myLUAS — Live Tram Times</title>

  <style>
    :root {
      --bg: #101411;
      --surface: #1a201c;
      --surface2: #242c26;
      --text: #f4f7f4;
      --muted: #a3aea5;
      --red: #ed4248;
      --green: #38d982;
      --border: #303a32;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, Arial, sans-serif;
      min-height: 100vh;
    }

    .container {
      width: min(100%, 680px);
      margin: auto;
      padding: 24px 18px 30px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -1.5px;
    }

    .logo span {
      color: var(--green);
    }

    .live-indicator {
      font-size: 12px;
      color: var(--green);
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 700;
    }

    .live-indicator::before {
      content: "";
      width: 8px;
      height: 8px;
      background: var(--green);
      border-radius: 50%;
    }

    .eyebrow {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    h1 {
      font-size: clamp(28px, 7vw, 40px);
      letter-spacing: -1.5px;
      margin: 0 0 22px;
    }

    .selector-card {
      background: var(--surface);
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 18px;
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
      font-weight: 700;
    }

    select {
      width: 100%;
      padding: 15px;
      background: var(--surface2);
      color: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
    }

    .nearest-button {
      width: 100%;
      margin-top: 12px;
      padding: 15px;
      background: #243c30;
      color: var(--green);
      border: 1px solid #385c47;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .nearest-button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .nearest-result {
      display: none;
      background: #202b23;
      border: 1px solid #385c47;
      border-radius: 14px;
      padding: 15px;
      margin-top: 12px;
      line-height: 1.6;
    }

    .nearest-result strong {
      color: var(--green);
    }

    .service-message {
      background: #252a20;
      border: 1px solid #48452d;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 22px;
      font-size: 14px;
      line-height: 1.5;
      color: #f2d68b;
    }

    .service-message strong {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 5px;
    }

    .line-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 25px 0 12px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .line-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .red-dot {
      background: var(--red);
    }

    .green-dot {
      background: var(--green);
    }

    .direction-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      margin-bottom: 14px;
      overflow: hidden;
    }

    .direction-header {
      padding: 17px 18px;
      border-bottom: 1px solid var(--border);
      font-size: 15px;
      font-weight: 700;
    }

    .tram-list {
      padding: 0 18px;
    }

    .tram {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 17px 0;
      border-bottom: 1px solid var(--border);
    }

    .tram:last-child {
      border-bottom: none;
    }

    .destination {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
    }

    .destination small {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-top: 4px;
      font-weight: 500;
    }

    .countdown {
      display: flex;
      align-items: baseline;
      gap: 4px;
      white-space: nowrap;
    }

    .countdown .number {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -1px;
      line-height: 1;
    }

    .countdown .unit {
      font-size: 12px;
      color: var(--muted);
    }

    .due {
      color: var(--green);
      font-size: 20px;
      font-weight: 900;
    }

    .empty {
      color: var(--muted);
      font-size: 14px;
      padding: 20px 0;
    }

    .status {
      margin-top: 20px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .error {
      display: none;
      background: #391d20;
      border: 1px solid #853c42;
      color: #ffb9bd;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    footer {
      text-align: center;
      color: #6f7a71;
      font-size: 11px;
      line-height: 1.6;
      margin-top: 32px;
    }

    .refresh-button {
      display: block;
      margin: 16px auto 0;
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 13px;
      cursor: pointer;
    }

    @media (min-width: 600px) {
      .container {
        padding-top: 40px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header>
      <div class="logo">my<span>LUAS</span></div>
      <div class="live-indicator">LIVE SERVICE</div>
    </header>

    <div class="eyebrow">Dublin Tram Tracker</div>
    <h1>Where's your tram?</h1>

    <section class="selector-card">
      <label for="stopSelect">YOUR LUAS STOP</label>

      <select id="stopSelect">
        <option value="MYS">Loading stops...</option>
      </select>

      <button class="nearest-button" id="nearestButton">
        📍 Find nearest stop
      </button>

      <div class="nearest-result" id="nearestResult"></div>
    </section>

    <div id="error" class="error" role="alert"></div>

    <section class="service-message">
      <strong>Service information</strong>
      <div id="serviceMessage">
        Waiting for service information...
      </div>
    </section>

    <div id="directions">
      <div class="empty">Loading tram forecasts...</div>
    </div>

    <div class="status">
      <div id="lastUpdated">Last updated: —</div>
      <div>Auto-refresh every 20 seconds</div>
    </div>

    <button class="refresh-button" id="refreshButton">
      ↻ Refresh now
    </button>

    <footer>
      Data: Transport Infrastructure Ireland.<br>
      Built by YOUR NAME for BDAIB.
    </footer>

  </main>

  <script>
    const API = "https://luas-class.kluxy.app";
    const REFRESH_INTERVAL = 20000;
    const EARTH_RADIUS_KM = 6371;
    const WALKING_SPEED_KMH = 5;

    const stopSelect = document.getElementById("stopSelect");
    const directionsElement = document.getElementById("directions");
    const serviceMessage = document.getElementById("serviceMessage");
    const lastUpdated = document.getElementById("lastUpdated");
    const errorElement = document.getElementById("error");
    const nearestButton = document.getElementById("nearestButton");
    const nearestResult = document.getElementById("nearestResult");

    let stops = [];
    let isLoading = false;

    function showError(message) {
      errorElement.style.display = "block";
      errorElement.textContent = "⚠ " + message;
    }

    function clearError() {
      errorElement.style.display = "none";
      errorElement.textContent = "";
    }

    async function fetchJSON(url) {
      const response = await fetch(url);

      if (!response.ok) {
        throw new Error(
          `HTTP ${response.status}: ${response.statusText}`
        );
      }

      return response.json();
    }

    async function loadStops() {
      try {
        const data = await fetchJSON(`${API}/stops`);

        if (!Array.isArray(data.stops)) {
          throw new Error("Unexpected stop list format.");
        }

        stops = data.stops;

        const savedStop =
          localStorage.getItem("myLUAS-stop") || "MYS";

        const selectedStop = stops.some(
          stop => stop.id === savedStop
        ) ? savedStop : "MYS";

        stopSelect.innerHTML = "";

        const redGroup = document.createElement("optgroup");
        redGroup.label = "🔴 Red Line";

        const greenGroup = document.createElement("optgroup");
        greenGroup.label = "🟢 Green Line";

        stops.forEach(stop => {
          const option = document.createElement("option");

          option.value = stop.id;
          option.textContent = stop.name;

          if (stop.line === "red") {
            redGroup.appendChild(option);
          } else if (stop.line === "green") {
            greenGroup.appendChild(option);
          }
        });

        stopSelect.append(redGroup, greenGroup);
        stopSelect.value = selectedStop;

        if (!stopSelect.value && stops.length) {
          stopSelect.value = stops[0].id;
        }

        await loadForecast();

      } catch (error) {
        showError("Could not load stops: " + error.message);
      }
    }

    async function loadForecast() {
      if (isLoading) return;

      isLoading = true;
      clearError();

      const stopId = stopSelect.value;

      if (!stopId) {
        showError("Please select a valid stop.");
        isLoading = false;
        return;
      }

      localStorage.setItem("myLUAS-stop", stopId);

      try {
        const data = await fetchJSON(
          `${API}/forecast?stop=${encodeURIComponent(stopId)}`
        );

        serviceMessage.textContent =
          data.message || "No service message available.";

        renderDirections(data.directions || []);

        lastUpdated.textContent =
          "Last updated: " +
          new Date().toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"
          });

      } catch (error) {
        showError("Could not load forecasts: " + error.message);

        directionsElement.innerHTML =
          '<div class="empty">Forecasts unavailable.</div>';

      } finally {
        isLoading = false;
      }
    }

    function renderDirections(directions) {
      directionsElement.innerHTML = "";

      if (!directions.length) {
        directionsElement.innerHTML =
          '<div class="empty">No directions available.</div>';
        return;
      }

      const stop = stops.find(
        s => s.id === stopSelect.value
      );

      const line = stop?.line || "red";

      directions.forEach((direction, index) => {
        const heading = document.createElement("div");
        heading.className = "line-heading";

        const dot = document.createElement("span");
        dot.className =
          "line-dot " +
          (line === "red" ? "red-dot" : "green-dot");

        heading.append(
          dot,
          document.createTextNode(
            `${line.toUpperCase()} LINE · Direction ${index + 1}`
          )
        );

        const card = document.createElement("section");
        card.className = "direction-card";

        const header = document.createElement("div");
        header.className = "direction-header";
        header.textContent = direction.name || "Direction";

        const tramList = document.createElement("div");
        tramList.className = "tram-list";

        const trams = (direction.trams || []).slice(0, 3);

        if (!trams.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "No trams currently available.";
          tramList.appendChild(empty);
        }

        trams.forEach(tram => {
          const row = document.createElement("div");
          row.className = "tram";

          const destination = document.createElement("div");
          destination.className = "destination";
          destination.textContent =
            tram.destination || "Unknown destination";

          const small = document.createElement("small");
          small.textContent = "Destination";
          destination.appendChild(small);

          const countdown = document.createElement("div");
          countdown.className = "countdown";

          const due = Number(tram.due);

          if (due === 0) {
            countdown.innerHTML =
              '<span class="due">Due</span>';

          } else if (Number.isFinite(due)) {
            const number = document.createElement("span");
            number.className = "number";
            number.textContent = due;

            const unit = document.createElement("span");
            unit.className = "unit";
            unit.textContent = "min";

            countdown.append(number, unit);

          } else {
            countdown.textContent = "—";
          }

          row.append(destination, countdown);
          tramList.appendChild(row);
        });

        card.append(header, tramList);
        directionsElement.append(heading, card);
      });
    }

    // Haversine formula: distance between two points on Earth.
    function haversine(lat1, lng1, lat2, lng2) {
      const toRadians = degrees =>
        degrees * Math.PI / 180;

      const dLat = toRadians(lat2 - lat1);
      const dLng = toRadians(lng2 - lng1);

      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(toRadians(lat1)) *
        Math.cos(toRadians(lat2)) *
        Math.sin(dLng / 2) ** 2;

      const c = 2 * Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1 - a)
      );

      return EARTH_RADIUS_KM * c;
    }

    function findNearestStop(userLat, userLng) {
      let nearestStop = null;
      let shortestDistance = Infinity;

      stops.forEach(stop => {
        const lat = Number(stop.lat);
        const lng = Number(stop.lng);

        if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
          return;
        }

        const distance = haversine(
          userLat,
          userLng,
          lat,
          lng
        );

        if (distance < shortestDistance) {
          shortestDistance = distance;
          nearestStop = stop;
        }
      });

      if (!nearestStop) {
        throw new Error("No stops have valid coordinates.");
      }

      return {
        stop: nearestStop,
        distance: shortestDistance
      };
    }

    function findNearest() {
      clearError();

      if (!stops.length) {
        showError("Stops have not loaded yet.");
        return;
      }

      if (!navigator.geolocation) {
        showError("Your browser does not support geolocation.");
        return;
      }

      nearestButton.disabled = true;
      nearestButton.textContent = "Finding your location...";

      navigator.geolocation.getCurrentPosition(
        async position => {
          try {
            const userLat = position.coords.latitude;
            const userLng = position.coords.longitude;

            const result = findNearestStop(userLat, userLng);

            const nearest = result.stop;
            const distance = result.distance;

            const walkingMinutes =
              (distance / WALKING_SPEED_KMH) * 60;

            const roundedMinutes =
              Math.max(1, Math.round(walkingMinutes));

            // Automatically select nearest stop.
            stopSelect.value = nearest.id;

            // Remember the nearest stop.
            localStorage.setItem("myLUAS-stop", nearest.id);

            // Show distance and estimated walking time.
            nearestResult.style.display = "block";

            nearestResult.innerHTML = `
              <strong>📍 Nearest Luas stop</strong><br>
              ${nearest.name}<br>
              Distance: ${distance.toFixed(2)} km<br>
              Estimated walking time: ${roundedMinutes} minutes
              <br><small>Estimated at 5 km/h</small>
            `;

            // Load live tram forecast for nearest stop.
            await loadForecast();

          } catch (error) {
            showError(error.message);

          } finally {
            nearestButton.disabled = false;
            nearestButton.textContent = "📍 Find nearest stop";
          }
        },

        error => {
          let message;

          switch (error.code) {
            case error.PERMISSION_DENIED:
              message =
                "Location permission denied. Please allow location access.";
              break;

            case error.POSITION_UNAVAILABLE:
              message = "Your location is unavailable.";
              break;

            case error.TIMEOUT:
              message = "Location request timed out. Please try again.";
              break;

            default:
              message = "Unable to determine your location.";
          }

          showError(message);

          nearestButton.disabled = false;
          nearestButton.textContent = "📍 Find nearest stop";
        },

        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }
      );
    }

    stopSelect.addEventListener("change", () => {
      nearestResult.style.display = "none";
      loadForecast();
    });

    nearestButton.addEventListener("click", findNearest);

    document.getElementById("refreshButton")
      .addEventListener("click", loadForecast);

    loadStops();

    setInterval(loadForecast, REFRESH_INTERVAL);
  </script>
</body>
</html>
